name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: CI never talks to real services. Real secrets stay in the host's settings.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  MONGODB_URI: mongodb://localhost:27017/oedf-ci?replicaSet=rs0
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
  CLOUDINARY_FOLDER: oedf-ci
  CLOUDINARY_URL: cloudinary://123456789012345:ci-only-secret@ci-cloud

jobs:
  quality:
    name: Quality checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run build
      - run: npm audit --audit-level=high
