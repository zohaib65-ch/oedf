name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: CI never talks to real services. Real secrets stay in the host's settings.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  MONGODB_URI: mongodb://localhost:27017/oedf-ci?replicaSet=rs0
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
  CLOUDINARY_FOLDER: oedf-ci
  CLOUDINARY_URL: cloudinary://123456789012345:ci-only-secret@ci-cloud
  # Used by the e2e job to create the first Super Admin and to sign in as them.

jobs:
  quality:
    name: Quality checks, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      # Unit and integration tests use mongodb-memory-server, so no database container is needed.
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # MongoDB must run as a single-node replica set so transactions work. Service containers cannot
      # pass server arguments, so it is started here.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval "1" >/dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          until docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 1; done
      - run: npm ci
      # The sample content needs an author; the tests create their own accounts.
      - run: npm run db:seed -- --email ci-admin@example.org --password ci-only-password-123
      # The public-page tests read the clearly labelled sample content.
      - run: npm run db:seed:sample
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
